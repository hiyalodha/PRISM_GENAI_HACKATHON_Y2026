[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-realtime-agent"
version = "0.1.0"
description = "Interruptible, full-duplex voice agent core with fast and slow paths, cancellation-safe tool calls and a deterministic replay harness."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "numpy>=1.26",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.2,<2"]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "pillow>=12",
]
mlx = [
    "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.7.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
prism-replay = "prism.harness.replay:main"
prism-score = "prism.harness.scorer:main"
prism-compare = "prism.harness.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
